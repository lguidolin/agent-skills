name: design
description: "UI/UX design, mockups, and visual work"

# brainstorming and writing-plans come from the superpowers plugin —
# see `plugins:` below.
skills:
  - interface-craft-and-accessibility
  - designing-before-building

plugins:
  - superpowers

mcps:
  - context7
  - browser

claudeignore:
  - "tests/**"
  - "dist/**"
  - "build/**"
  - "node_modules/**"
  - "docs/superpowers/archive/**"

hooks:
  pre_session: true
  post_session: false
