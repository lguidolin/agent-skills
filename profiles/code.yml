name: code
description: "Implementation, debugging, testing, and committing"

# TDD, systematic debugging, and verification-before-completion come from
# the superpowers plugin — see `plugins:` below. House skills here cover
# what superpowers does not: commit conventions, security, code craft.
skills:
  - change-hygiene-and-code-craft
  - tests-as-a-control
  - conventional-commits-and-releases
  - defense-in-depth-security
  - verification-gate-and-automation

plugins:
  - superpowers

mcps:
  - context7

claudeignore:
  - "docs/superpowers/archive/**"

hooks:
  pre_session: true
  post_session: false
