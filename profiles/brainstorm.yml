name: brainstorm
description: "Ideation, spec writing, and design exploration"

# Ideation methodology (brainstorming, writing-plans) comes from the
# superpowers plugin — see `plugins:` below. Only house skills that
# superpowers does not cover are listed here.
skills:
  - designing-before-building
  - recording-decisions

plugins:
  - superpowers

mcps:
  - context7

claudeignore:
  - "src/**"
  - "tests/**"
  - "dist/**"
  - "build/**"
  - "node_modules/**"
  - "docs/superpowers/archive/**"

hooks:
  pre_session: true
  post_session: false
